# TypeScript 검사기 자체 시험. sentinel-tool/setup.sh 가 잠금 파일의 주소·지문으로 Node 와 의존성을 받고 dist 를 빌드한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore the sealed toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: ts-toolchain-${{ runner.os }}-${{ hashFiles('toolchain.lock.json', 'package-lock.json') }}
      - name: Bootstrap the checker (locked Node, packages and dist build)
        run: sentinel-tool/setup.sh
      - name: Run the checker's tests
        run: ./scripts/node.sh --test test/*.test.mjs
